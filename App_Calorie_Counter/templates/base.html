<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container mt-5">
      {% include 'messages.html' %}
      <h2 class="text-center mb-5">{{form_title}}</h2>

      <form class="card p-5" action="" method="POST">
        {% csrf_token %} 
        {{form.as_p}}
        <input type="submit" value="{{btn}}" class="btn btn-primary" />

        <div class="text-center mt-3">
          {% if btn == 'Register' %}
          <p>Already have an account? Login <a href="{% url 'login' %}">Here</a></p>
          {% else %}
          <p>Create New Account <a href="{% url 'register' %}">Here</a></p>
          {% endif %}
        </div>

      </form>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
